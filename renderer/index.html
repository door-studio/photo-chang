<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>PhotoChang 修图工具</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">

  <header id="menubar">
    <div class="brand">
      <span class="brand-mark"></span>
      <span class="brand-name">PhotoChang</span>
    </div>
    <nav id="menus" class="menus"></nav>
    <div class="menubar-actions">
      <button class="ghost-btn" id="btn-new" title="新建画布 (Ctrl+N)">新建</button>
      <button class="ghost-btn" id="btn-open" title="打开图片 (Ctrl+O)">打开</button>
      <button class="primary-btn" id="btn-save" title="保存为 PNG (Ctrl+S)">保存 PNG</button>
    </div>
  </header>

  <div id="body">

    <aside id="toolbar">
      <div class="tool-grid" id="tool-grid">
        <button class="tool-btn" data-tool="select" title="选择 / 移动 (V)">
          <svg viewBox="0 0 24 24"><path d="M5 3l13 8-6 1.4L9.4 18 5 3z"/></svg>
        </button>
        <button class="tool-btn" data-tool="pencil" title="铅笔 (P)">
          <svg viewBox="0 0 24 24"><path d="M3 17.2V21h3.8L17.9 9.9l-3.8-3.8L3 17.2zM20.7 7.1c.4-.4.4-1 0-1.4l-2.4-2.4c-.4-.4-1-.4-1.4 0l-1.8 1.8 3.8 3.8 1.8-1.8z"/></svg>
        </button>
        <button class="tool-btn" data-tool="brush" title="画笔 (B)">
          <svg viewBox="0 0 24 24"><path d="M4 20c2.5 0 4-1.4 4-3.3 0-1-.5-1.7-.5-2.6C7.5 12 9 10.4 11 9.2c2.6-1.5 3.2-3.4 3.2-5.2 2 1.2 3.3 3 3.3 5.3 0 3.6-2.6 5.3-4.7 6.7-1.4 1-2.1 1.9-2.1 3 0 1.6 1.2 2.6 2.8 2.6C15.6 21.6 17 22 19 22H5.5C4.7 22 4 21.2 4 20z"/></svg>
        </button>
        <button class="tool-btn" data-tool="eraser" title="橡皮擦 (E)">
          <svg viewBox="0 0 24 24"><path d="M16.2 3.3l4.5 4.5c.7.7.7 1.8 0 2.5l-8 8H7.4l-3.7-3.7c-.7-.7-.7-1.8 0-2.5l9.9-9.1c1.3-1.3 2.6-.4 2.6.3zM6.3 16.3l3.9 3.9H4.6l1.7-3.9z"/></svg>
        </button>
        <button class="tool-btn" data-tool="fill" title="填充 (F)">
          <svg viewBox="0 0 24 24"><path d="M10.6 2.6l9.4 9.4c.4.4.4 1 0 1.4l-6.6 6.6c-.4.4-1 .4-1.4 0L2.6 10.6c-.4-.4-.4-1 0-1.4l6.6-6.6c.8-.8 1.6-1 2.4 0zM6 4.4L3.2 7.2c-.4.4-.4 1 0 1.4l6.6 6.6L15 10 6 4.4zM21 16.5c.9 1.4 1.5 2.6 1.5 3.4 0 1-.8 1.8-1.8 1.8s-1.8-.8-1.8-1.8c0-.8.7-2 1.6-3.4l.6-.8.6.8z"/></svg>
        </button>
        <button class="tool-btn" data-tool="line" title="直线 (L)">
          <svg viewBox="0 0 24 24"><path d="M3.7 20.3a1 1 0 0 1 0-1.4L18.9 3.7a1 1 0 1 1 1.4 1.4L5.1 20.3a1 1 0 0 1-1.4 0z"/></svg>
        </button>
        <button class="tool-btn" data-tool="rect" title="矩形 (R)">
          <svg viewBox="0 0 24 24"><path d="M3 5h18v14H3V5zm2 2v10h14V7H5z"/></svg>
        </button>
        <button class="tool-btn" data-tool="ellipse" title="椭圆 (C)">
          <svg viewBox="0 0 24 24"><path d="M12 4c4.4 0 8 3.6 8 8s-3.6 8-8 8-8-3.6-8-8 3.6-8 8-8zm0 2c-3.3 0-6 2.7-6 6s2.7 6 6 6 6-2.7 6-6-2.7-6-6-6z"/></svg>
        </button>
        <button class="tool-btn" data-tool="text" title="文字 (T)">
          <svg viewBox="0 0 24 24"><path d="M5 4h14v3h-5v13h-4V7H5V4z"/></svg>
        </button>
        <button class="tool-btn" data-tool="eyedropper" title="吸管取色 (I)">
          <svg viewBox="0 0 24 24"><path d="M18.5 2a3.5 3.5 0 0 1 2.5 6l-2.2 2.2 1 1-1.4 1.4-1-1-6.5 6.5-3.4.9.9-3.4 6.5-6.5-1-1L15.3 6.7l1 1 2.2-2.2A3.5 3.5 0 0 1 18.5 2zm-.6 1.9a1.6 1.6 0 1 0 0 3.2 1.6 1.6 0 0 0 0-3.2z"/></svg>
        </button>
      </div>

      <div class="tool-options" id="tool-options">
        <div class="option-row" data-for="brush eraser">
          <label>大小 <span class="value" id="opt-size-value">4</span></label>
          <input type="range" id="opt-size" min="1" max="64" step="1" value="4">
        </div>
        <div class="option-row" data-for="rect ellipse">
          <label>样式</label>
          <div class="segmented" id="opt-shape-mode">
            <button data-mode="fill" class="active">填充</button>
            <button data-mode="stroke">描边</button>
          </div>
        </div>
        <div class="option-row" data-for="rect ellipse line">
          <label>描边粗细 <span class="value" id="opt-stroke-value">1</span></label>
          <input type="range" id="opt-stroke" min="1" max="16" step="1" value="1">
        </div>
        <div class="option-row" data-for="text">
          <label>字体</label>
          <select id="opt-font">
            <option value="sans-serif">默认无衬线</option>
            <option value="'Microsoft YaHei', 'PingFang SC', sans-serif">微软雅黑</option>
            <option value="'SimHei', sans-serif">黑体</option>
            <option value="'SimSun', serif">宋体</option>
            <option value="'KaiTi', serif">楷体</option>
            <option value="Arial, sans-serif">Arial</option>
            <option value="Georgia, serif">Georgia</option>
          </select>
        </div>
        <div class="option-row" data-for="text">
          <label>字号 <span class="value" id="opt-fontsize-value">16</span></label>
          <input type="range" id="opt-fontsize" min="6" max="120" step="1" value="16">
        </div>
        <div class="option-row" data-for="text">
          <label>对齐</label>
          <div class="segmented" id="opt-text-align">
            <button data-align="left" class="active">左</button>
            <button data-align="center">中</button>
            <button data-align="right">右</button>
          </div>
        </div>
        <div class="option-row" data-for="select">
          <label>选区</label>
          <div class="segmented">
            <button id="opt-select-all">全选</button>
            <button id="opt-select-none">取消</button>
          </div>
        </div>
      </div>

      <div class="palette" id="palette">
        <div class="palette-head">
          <div class="palette-current" id="palette-current" title="当前颜色"></div>
          <input type="text" id="palette-hex" class="palette-hex" maxlength="7" spellcheck="false" value="#000000">
        </div>
        <canvas id="palette-sv" class="palette-sv" width="184" height="112"></canvas>
        <canvas id="palette-hue" class="palette-hue" width="184" height="14"></canvas>
        <div class="palette-label">预设颜色</div>
        <div class="palette-swatches" id="palette-presets"></div>
        <div class="palette-label">最近使用</div>
        <div class="palette-swatches" id="palette-recent"></div>
      </div>
    </aside>

    <section id="viewport">
      <div id="stage">
        <canvas id="art"></canvas>
        <canvas id="overlay"></canvas>
      </div>
      <div id="viewport-empty" class="viewport-empty">画布为空 · 用左侧工具开始绘制</div>
    </section>

    <aside id="adjust-panel" class="closed">
      <div class="panel-title">
        <span>色彩调整</span>
        <button class="icon-btn" id="btn-adjust-close" title="关闭">✕</button>
      </div>
      <div class="adjust-row">
        <label>亮度 <span class="value" id="val-brightness">0</span></label>
        <input type="range" id="adj-brightness" min="-100" max="100" value="0">
      </div>
      <div class="adjust-row">
        <label>对比度 <span class="value" id="val-contrast">0</span></label>
        <input type="range" id="adj-contrast" min="-100" max="100" value="0">
      </div>
      <div class="adjust-row">
        <label>饱和度 <span class="value" id="val-saturation">0</span></label>
        <input type="range" id="adj-saturation" min="-100" max="100" value="0">
      </div>
      <div class="adjust-row">
        <label>色相 <span class="value" id="val-hue">0</span></label>
        <input type="range" id="adj-hue" min="-180" max="180" value="0">
      </div>
      <div class="adjust-buttons">
        <button id="adj-grayscale">灰度</button>
        <button id="adj-invert">反色</button>
        <button id="adj-reset">重置</button>
      </div>
      <p class="panel-note">调整直接作用于当前画布，可用 Ctrl+Z 撤销。</p>
    </aside>

  </div>

  <footer id="statusbar">
    <span class="status-item" id="status-tool">铅笔</span>
    <span class="status-item" id="status-canvas">480 × 360</span>
    <span class="status-item" id="status-pos">—</span>
    <span class="status-item" id="status-selection"></span>
    <div class="zoom-controls">
      <button class="icon-btn" id="zoom-out" title="缩小 (Ctrl+-)">−</button>
      <input type="range" id="zoom-range" min="0" max="100" value="50">
      <button class="icon-btn" id="zoom-in" title="放大 (Ctrl+=)">＋</button>
      <span class="zoom-label" id="zoom-label">100%</span>
      <button class="ghost-btn small" id="zoom-fit" title="适应窗口 (Ctrl+9)">适应</button>
      <button class="ghost-btn small" id="zoom-actual" title="实际大小 (Ctrl+0)">1:1</button>
    </div>
  </footer>

</div>

<input type="file" id="file-input" accept="image/*" hidden>
<textarea id="text-capture" class="text-capture" spellcheck="false" autocomplete="off"></textarea>
<div id="menu-layer"></div>

<script src="js/engine.js"></script>
<script src="js/history.js"></script>
<script src="js/palette.js"></script>
<script src="js/app.js"></script>
</body>
</html>
